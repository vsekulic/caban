# --- Groupings ---------------------------------------------------------------------------------------
# 1–7: published. Membership comes from each mapping file's own session columns (the ground truth),
# not from this file. They are re-derived by the runner as a reproducibility check; the published
# files are kept (-ORIG) and stay what analyses use unless VS decides otherwise.
# 8+: computed ahead of time; NO analysis uses them automatically (VS, 2026-10-10).
# Fewer cells are matched the more sessions a grouping has and the longer it spans (drift).
groupings:
  1: {name: conditioning_day, published: true, about: "LT1, LT2, TFC_cond of the conditioning day (Fig. 2)"}
  2: {name: cond_to_testB, published: true, about: "TFC_cond -> Test_B"}
  3: {name: testB_day, published: true, about: "LT1 and TFC_test_B of the Test_B day"}
  4: {name: cond_testB_testB1wk, published: true, about: "TFC_cond -> Test_B -> Test_B_1wk"}
  5: {name: testB1wk_day, published: true, about: "LT1 and TFC_test_B_1wk of the Test_B_1wk day"}
  6: {name: cond_all_tests, published: true, about: "TFC_cond + all four tests"}
  7: {name: cond_testA_testA1wk, published: true, about: "TFC_cond -> Test_A -> Test_A_1wk"}
  8: {name: conditioning_day_all, roles: all,
      about: "every role of the conditioning day: per-cell trajectory across drug onset and conditioning"}
  9: {name: conditioning_day_no_HC, roles: [LT_pre, CNO_early, CNO_late, LT_post, TFC_cond],
      about: "as 8 without homecage (HC activity varies greatly)"}
  10a: {name: CNO_early_late, roles: [CNO_early, CNO_late], require_all: true,
        about: "right after vs ~20 min after injection; the 11 mice with both (key)"}
  10b: {name: preinjection_CNO_late, roles: [HC_preinjection, CNO_late], require_all: true,
        about: "homecage before injection vs ~20 min after; the 10 mice of G12–G21"}
  11: {name: all_LT, sessions: "every LT1 of track days 1–5, and every LT1/LT2 of every other day (conditioning: LT_pre, LT_post)",
       about: "place-cell stability over days and weeks"}
  12: {name: track_day1, sessions: "HC1, LT1, HC2 of track day 1", about: "homecage vs track; reactivation in HC after LT"}
  13: {name: track_day2, sessions: "HC1, LT1, HC2 of track day 2", about: "as 12"}
  14: {name: track_day3, sessions: "HC1, LT1, HC2 of track day 3", about: "as 12"}
  15: {name: track_day4, sessions: "HC1, LT1, HC2 of track day 4 (G08, G09)", about: "as 12"}
  16: {name: track_day5, sessions: "HC1, LT1, HC2 of track day 5 (G08, G09)", about: "as 12"}
  17: {name: all_HC, sessions: "every HC session (track days, test days, conditioning-day HC roles); not HC0 or misc",
       about: "homecage baseline over the experiment"}
  18: {name: iso_pair, mice: [G05], sessions: ["2021_09_01-TFC_test_B/15_11_43-HC1", "2021_09_01-TFC_test_B/15_20_05-iso"],
       about: "awake homecage vs isoflurane (plans/isoflurane_recording_analysis_plan.md)"}

