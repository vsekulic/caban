# Cross-registration groupings — the high-level definition (plans/crossreg_batch_runner_plan.md §3, §6).
#
# This short file is the one to read. scripts/compile_crossreg_groupings.py compiles it, with the
# session folders on MINISCOPE and the published mapping files, into caban/crossreg_groupings.json
# (every session of every grouping, per mouse), which the code reads. Do not edit the JSON by hand.
#
# Every session of G05–G21 with video must be in a grouping or in `not_used` below; the compiler fails
# otherwise, so nothing is left out silently.

# --- The conditioning day, by ROLE (VS, 2026-10-10) ------------------------------------------------
# The two cohorts recorded the day differently (folder names differ, roles do not):
#   G05–G11: HC1, LT1, CNO1, CNO2, LT2, HC2, TFC_cond, HC3
#   G12–G21: HC1, LT1, HC2, CNO1, [CNO2], LT2, HC3, TFC_cond, HC4
# CNO1 = right after injection; CNO2 = ~20 min after, just before LT2 (G26's notes; session timing).
# Where a mouse has a single CNO recording ~20 min after HC2, running straight into LT2, it is CNO_late.
# In G12–G21, HC2 is recorded right after LT1, before the injection: HC_preinjection.
roles: [HC_start, LT_pre, HC_preinjection, CNO_early, CNO_late, LT_post, HC_preTFC, TFC_cond, HC_postTFC]
conditioning_day:   # session start times (the folder's time prefix); "-" = none
  #      HC_start  LT_pre    HC_preinj CNO_early CNO_late  LT_post   HC_preTFC TFC_cond  HC_postTFC
  G05: ["16_29_01", "16_47_02", "-",        "17_12_02", "17_30_19", "17_44_51", "18_07_14", "18_22_57", "18_59_38"]
  G06: ["09_52_24", "10_14_41", "-",        "10_34_09", "10_49_52", "11_05_51", "11_26_52", "11_42_00", "12_17_29"]
