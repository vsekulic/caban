# minian-local: the Minian CNMF-E environment, pinned to the versions the RIKEN CBP server
# ran in production (minian_vsekulic_cbp-db.yaml), built as Intel (osx-64) packages and run
# under Rosetta on Apple Silicon. See plans/local_minian_pipeline_plan.md §4.2.
#
# Rebuild (the CONDA_SUBDIR is what makes it osx-64; without it the 2021 pins do not solve):
#   CONDA_SUBDIR=osx-64 mamba env create -f envs/minian-local.yml
#   conda activate minian-local && conda config --env --set subdir osx-64
# Minian itself is not installed: run with PYTHONPATH pointing at the fork,
#   ~/cbp-db/vsekulic/minian_vsekulic  (origin/vsekulic_v4, a3216ae2)
