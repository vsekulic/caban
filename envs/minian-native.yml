# minian-native: the working Minian CNMF-E environment, native Apple Silicon (osx-arm64).
# Matches the RIKEN CBP server's *working* `minian` env (the one bin/jupyter_minian.sh activated),
# GUI + Jupyter stack included, except packages with no arm64 build at the server's version
# (plans/local_minian_pipeline_plan.md §4.2):
#   opencv 4.2.0 -> 4.5.0      scikit-learn 0.22.1 -> 0.23.2
#   simpleitk 2.0.2 -> 2.1.1 (PyPI wheel; conda's 2.1.1.1 clashes with opencv 4.5.0 over hdf5)
#   medpy 0.4.0 (PyPI; never on conda for arm64)      netcdf4 unpinned (not on the CNMF-E path)
#   ffmpeg 4.2.3 -> 4.3.2    bokeh 1.4.0, panel 0.8.0, selenium 3.141.0 from PyPI (no arm64 conda build)
# envs/minian-local.yml is a Rosetta (osx-64) twin with every pin of the server's `minian_cbp-db`
# export, no GUI stack; kept only as a fidelity reference for the §6 gate.
#
# Rebuild:
#   CONDA_SUBDIR=osx-arm64 mamba env create -f envs/minian-native.yml
#   bash envs/minian-native-postinstall.sh     # PyPI packages + the server's jinja2 patch to
#                                              # bokeh/panel; re-run after any conda operation
# Minian itself is NOT installed into the env, deliberately: the notebooks import `minian` from
# their own folder, so launch Jupyter from the fork's working copy, as the server did:
#   cd ~/code/minian_vsekulic && conda activate minian-native && jupyter notebook
# (working copy of github.com/vsekulic/minian @ vsekulic_v4 = upstream Minian 1.1.0 + 3 commits;
#  the WORKING notebooks and prev/ are untracked there, copied from ~/cbp-db/vsekulic/minian_vsekulic)
